  "GpuBuffer", "GpuBufferDescriptor", "GpuShaderModule", "GpuShaderModuleDescriptor",
  "GpuRenderPipeline", "GpuRenderPipelineDescriptor", "GpuVertexState", "GpuFragmentState", "GpuColorTargetState",
  "GpuVertexBufferLayout", "GpuVertexAttribute", "GpuVertexFormat", "GpuVertexStepMode", "GpuPrimitiveState",
  "GpuPrimitiveTopology", "GpuCullMode", "GpuFrontFace", "GpuDepthStencilState", "GpuCompareFunction", "GpuMultisampleState",
