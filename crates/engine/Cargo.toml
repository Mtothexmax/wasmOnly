[package]
name = "engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Threads backend: needs the pinned nightly (build-std with +atomics,+bulk-memory). Build with
# `node tools/dev.mjs build --threads`. The engine API is identical without it (see src/jobs.rs).
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]
# Additionally run rapier's solver on the pool (faster, but contact ordering may vary between runs).
threads-physics = ["threads", "rapier3d/parallel"]

[dependencies]
noise = { version = "0.9", default-features = false }
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
glam.workspace = true
hecs.workspace = true
rapier3d.workspace = true
gltf.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
console_error_panic_hook.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "console", "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node", "CssStyleDeclaration",
  "DomRect", "Navigator", "Performance", "KeyboardEvent", "PointerEvent", "MouseEvent", "WheelEvent", "Event", "EventTarget",
  "AddEventListenerOptions", "Response", "Request", "Blob", "BlobPropertyBag", "ImageBitmap", "Gamepad", "GamepadButton",
  "ResizeObserver", "Clipboard", "GpuTexelCopyBufferInfo", "ImageData", "Url", "ImageEncodeOptions", "Storage", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "DomStringList", "DomException", "GpuQuerySet", "GpuQuerySetDescriptor", "GpuQueryType", "GpuRenderPassTimestampWrites", "GpuComputePassTimestampWrites", "GpuBlendState", "GpuBlendComponent", "GpuBlendFactor", "GpuBlendOperation", "HtmlAudioElement", "HtmlMediaElement", "MediaElementAudioSourceNode", "TimeRanges", "MediaError", "RequestInit", "GpuTexelCopyTextureInfo", "GpuTexelCopyBufferLayout", "BiquadFilterNode", "BiquadFilterType", "DelayNode", "ConvolverNode", "WaveShaperNode", "OverSampleType", "StereoPannerNode", "GpuComputePipeline", "GpuComputePipelineDescriptor", "GpuProgrammableStage", "GpuComputePassEncoder", "GpuComputePassDescriptor", "GpuStorageTextureBindingLayout", "GpuStorageTextureAccess", "GpuSupportedFeatures", "gpu_map_mode", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioParam", "GainNode", "PannerNode", "PanningModelType", "DistanceModelType", "AudioListener", "AudioDestinationNode", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ResizeObserverEntry", "FocusEvent",
